[/script/theisle.igamesession]
ServerName=My Amazing Server ; The name of the server to show in the Server List.
bServerGlobalChat=true ; Enables/Disables Global Chat in the server. When disabled, only Group and Local chats may be used.
bServerNameTags=true ; When enabled, Name Tags will appear above nearby players heads.
bServerGrowth=true ; Allows the players dinosaur to grow. In Sandbox if this is enabled, a player logging in as an Adult, Juvie or Hatchling dinosaur will start from the beginning of their respective growth stage. Once they've reached the full extent of the growth stage, they no longer progress. When disabled, they will just be the full growth of the respective stage upon spawning in.
bServerFallDamage=true ; Controls whether players will take fall damage in the server.
bServerAllowTurnInPlace=true ; Controls the ability for the player to turn in place (aka. Alt Turn) in the server.
bServerAllowReplayRecording=true ; Allow/Deny players to do Replay Recordings on the server.
ServerDeadBodyTime=200 ; How many seconds before corpses/bodies despawn.
ServerRespawnTime=30 ; Time to wait in seconds before player is allowed to respawn (Sandbox)
ServerLogoutTime=60 ; Time to wait before player can safely log out of the server.
ServerDiscord= ; Input is taken but button is removed in-game. Add it to the MOTD or name instead.
ServerAdmins= ; Enter the STEAMID64 of the player you want to be an admin. Repeat this for each player.
ServerAdmins=

